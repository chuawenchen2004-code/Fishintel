<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FishIntel | AI Fish Species Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
body { min-height:100vh; background: radial-gradient(circle at top, #0ea5e9 0%, #0369a1 30%, #020617 100%); color:white; display:flex; align-items:center; justify-content:center; padding:20px; }
.container { max-width:1100px; width:100%; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:30px; }
.header h1 { font-size:48px; line-height:1; margin-bottom:10px; } 
.header h1 span { background: linear-gradient(to right, #7dd3fc, #bae6fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.badge { background: rgba(125,211,252,0.15); border:1px solid #7dd3fc; padding:6px 12px; border-radius:20px; font-size:12px; letter-spacing:1px; display:inline-block; margin-bottom:20px; }
.card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,0.15); border-radius:24px; padding:28px; }
.upload-zone { border:2px dashed rgba(125,211,252,0.4); border-radius:16px; padding:40px 20px; text-align:center; cursor:pointer; transition:0.3s; }
.upload-zone:hover { background: rgba(125,211,252,0.08); border-color:#7dd3fc; }
.upload-zone .icon { font-size:40px; margin-bottom:10px; }
.btn { background: linear-gradient(to right, #0ea5e9, #38bdf8); border:none; padding:14px 28px; border-radius:12px; color:white; font-weight:600; font-size:16px; cursor:pointer; width:100%; margin-top:16px; transition:0.2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(14,165,233,0.4); }
#resultImg { width:100%; border-radius:16px; margin-top:20px; display:none; object-fit:cover; max-height:400px; }
.species-card { background: rgba(255,255,255,0.1); padding:12px 16px; border-radius:12px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; }
.conf { color:#7dd3fc; font-weight:700; }
.wave { position:fixed; bottom:0; left:0; width:100%; opacity:0.15; pointer-events:none; }
@media(max-width:800px){ .container{grid-template-columns:1fr} }
</style>
</head>
<body>
<svg class="wave" viewBox="0 0 1440 320"><path fill="#ffffff" d="M0,160L48,176C96,192,192,224,288,218.7C384,213,480,171,576,165.3C672,160,768,192,864,197.3C960,203,1056,181,1152,160C1248,139,1344,117,1392,106.7L1440,96L1440,320L0,320Z"></path></svg>

<div class="container">
  <div>
    <div class="header">
      <div class="badge">🐟 UMT PROJECT • FISHINTEL v2.0</div>
      <h1>Intelligent<br><span>Fish Species</span><br>Detection</h1>
      <p style="opacity:0.7; margin-top:15px; line-height:1.6;">Powered by YOLOv8. Upload any fish image and our AI will identify species, confidence, and count. Built for Marine Biology & Aquaculture.</p>
      
      <div style="margin-top:30px; display:flex; gap:12px;">
        <div class="card" style="flex:1; padding:16px; text-align:center;"><h2>3+</h2><p style="font-size:12px; opacity:0.6;">SPECIES</p></div>
        <div class="card" style="flex:1; padding:16px; text-align:center;"><h2>95%</h2><p style="font-size:12px; opacity:0.6;">ACCURACY</p></div>
        <div class="card" style="flex:1; padding:16px; text-align:center;"><h2>YOLOv8</h2><p style="font-size:12px; opacity:0.6;">ENGINE</p></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:16px;">🌊 Try Detection</h3>
    <label for="fileInput" class="upload-zone" id="dropZone">
      <div class="icon">📤</div>
      <p><b>Drop fish image here</b></p>
      <p style="font-size:12px; opacity:0.6; margin-top:6px;">Supports JPG, PNG — Tuna, Salmon, Mackerel</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </label>
    
    <button class="btn" onclick="detect()">✨ Identify Species</button>
    <p id="status" style="text-align:center; margin-top:12px; font-size:14px; opacity:0.8;"></p>
    <img id="resultImg">
    <div id="detections"></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
fileInput.addEventListener('change', () => dropZone.querySelector('p').innerHTML = `<b>${fileInput.files[0].name}</b> selected`);

async function detect() {
  const file = fileInput.files[0];
  if (!file) { alert('Please select a fish image first 🐟'); return; }
  const form = new FormData(); form.append('file', file);
  document.getElementById('status').innerText = '🔍 Analyzing with YOLOv8...';
  
  try {
    const res = await fetch('/detect', { method: 'POST', body: form });
    const data = await res.json();
    document.getElementById('status').innerText = `Model: ${data.model_used} • ${data.fish_detected} fish detected`;
    let html = '';
    data.detections.forEach(d => {
      html += `<div class="species-card"><span>🐠 ${d.species}</span><span class="conf">${(d.confidence*100).toFixed(1)}%</span></div>`;
    });
    if(data.detections.length==0) html = '<p style="margin-top:15px; opacity:0.6;">No fish detected, try another image.</p>';
    document.getElementById('detections').innerHTML = html;
    const img = document.getElementById('resultImg');
    img.src = '/result-image?' + Date.now();
    img.style.display = 'block';
  } catch(e){
    document.getElementById('status').innerText = 'Error - is FastAPI running?';
  }
}
</script>
</body>
</html>
